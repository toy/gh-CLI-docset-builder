        <div>
          <h2 id="gh-repo-gitignore-view" data-element-type="Command">gh repo gitignore view</h2>

<div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>gh repo gitignore view &lt;template&gt;
</code></pre></div></div>

<p>View an available repository <code class="language-plaintext highlighter-rouge">.gitignore</code> template.</p>

<p><code class="language-plaintext highlighter-rouge">&lt;template&gt;</code> is a case-sensitive <code class="language-plaintext highlighter-rouge">.gitignore</code> template name.</p>

<p>For a list of available templates, run <code class="language-plaintext highlighter-rouge">gh repo gitignore list</code>.</p>

<h3 id="examples">Examples</h3>

<figure class="highlight"><pre><code class="language-bash" data-lang="bash"><span class="c"># View the Go gitignore template</span>
<span class="nv">$ </span>gh repo gitignore view Go

<span class="c"># View the Python gitignore template</span>
<span class="nv">$ </span>gh repo gitignore view Python

<span class="c"># Create a new .gitignore file using the Go template</span>
<span class="nv">$ </span>gh repo gitignore view Go <span class="o">&gt;</span> .gitignore

<span class="c"># Create a new .gitignore file using the Python template</span>
<span class="nv">$ </span>gh repo gitignore view Python <span class="o">&gt;</span> .gitignore</code></pre></figure>
